<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      background: #0f172a;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }
    .icon {
      font-size: 28px;
    }
    h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
      color: #38bdf8;
    }
    p {
      margin: 4px 0 14px 0;
      font-size: 12px;
      color: #94a3b8;
      line-height: 1.4;
    }
    .status-box {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      margin-right: 6px;
    }
    .btn {
      display: block;
      width: 100%;
      box-sizing: border-box;
      text-align: center;
      padding: 10px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 13px;
      text-decoration: none;
      cursor: pointer;
      margin-bottom: 8px;
      border: none;
    }
    .btn-primary {
      background: linear-gradient(135deg, #00f2fe, #4facfe);
      color: #0f172a;
    }
    .btn-secondary {
      background: #1e293b;
      color: #38bdf8;
      border: 1px solid #38bdf8;
    }
    .tip {
      font-size: 11px;
      color: #64748b;
      text-align: center;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="icon">🚗</div>
    <div>
      <h1>ReVahan Quick Launch</h1>
      <div style="font-size: 11px; color: #94a3b8;">AI Vehicle Valuation</div>
    </div>
  </div>

  <div class="status-box">
    <span style="font-size: 12px;"><span class="dot"></span>Local Server: Active</span>
    <span style="font-size: 11px; color: #38bdf8;">127.0.0.1:5000</span>
  </div>

  <button id="openLocalBtn" class="btn btn-primary">🚀 Open Local App (127.0.0.1:5000)</button>
  <button id="openCloudBtn" class="btn btn-secondary">🌐 Open Cloudflare Online Link</button>

  <div class="tip">
    💡 <b>Tip:</b> Type <b>revahan</b> in Chrome address bar and press Enter to launch anytime!
  </div>

  <script src="popup.js"></script>
</body>
</html>
